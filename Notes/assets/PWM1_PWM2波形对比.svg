<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="820" height="420" fill="#0d1117"/>
  <text x="20" y="30" fill="#e6edf3" font-size="16" font-weight="bold">STM32 输出比较：PWM1 vs PWM2（向上计数，ARR=999, CCR=300）</text>

  <!-- 图1 PWM1 -->
  <text x="20" y="70" fill="#58a6ff" font-size="14" font-weight="bold">PWM1（CNT&lt;CCR 有效）</text>
  <line x1="20" y1="90" x2="800" y2="90" stroke="#30363d" stroke-width="1"/>
  <!-- PWM1 高电平段 0~300，低电平 300~999 -->
  <rect x="30" y="100" width="270" height="40" fill="#2ea043"/>
  <rect x="300" y="100" width="470" height="40" fill="#30363d"/>
  <line x1="30" y1="100" x2="800" y2="100" stroke="#30363d" stroke-width="1"/>
  <line x1="30" y1="140" x2="800" y2="140" stroke="#30363d" stroke-width="1"/>
  <text x="330" y="165" fill="#e6edf3" font-size="12">0</text>
  <text x="300" y="165" fill="#f78166" font-size="12" text-anchor="middle">CCR=300</text>
  <text x="790" y="165" fill="#f78166" font-size="12" text-anchor="end">ARR=999</text>
  <text x="165" y="165" fill="#7ee787" font-size="12" text-anchor="middle">高 30%</text>
  <text x="540" y="165" fill="#8b949e" font-size="12" text-anchor="middle">低 70%</text>

  <!-- 图2 PWM2 -->
  <text x="20" y="220" fill="#58a6ff" font-size="14" font-weight="bold">PWM2（CNT&lt;CCR 无效）</text>
  <line x1="20" y1="240" x2="800" y2="240" stroke="#30363d" stroke-width="1"/>
  <!-- PWM2 低电平段 0~300，高电平 300~999 -->
  <rect x="30" y="250" width="270" height="40" fill="#30363d"/>
  <rect x="300" y="250" width="470" height="40" fill="#2ea043"/>
  <line x1="30" y1="250" x2="800" y2="250" stroke="#30363d" stroke-width="1"/>
  <line x1="30" y1="290" x2="800" y2="290" stroke="#30363d" stroke-width="1"/>
  <text x="165" y="315" fill="#8b949e" font-size="12" text-anchor="middle">低 30%</text>
  <text x="540" y="315" fill="#7ee787" font-size="12" text-anchor="middle">高 70%</text>
  <text x="300" y="315" fill="#f78166" font-size="12" text-anchor="middle">CCR=300</text>
  <text x="790" y="315" fill="#f78166" font-size="12" text-anchor="end">ARR=999</text>

  <!-- 结论 -->
  <rect x="20" y="350" width="780" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="35" y="380" fill="#e6edf3" font-size="13">结论：PWM1 与 PWM2 输出互补（同极性下）。</text>
  <text x="35" y="398" fill="#8b949e" font-size="12">PWM1+High ≈ PWM2+Low（高电平 30%）；PWM1+Low ≈ PWM2+High（高电平 70%）</text>
</svg>
