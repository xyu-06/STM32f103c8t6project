<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240">
  <!-- 背景 -->
  <rect width="640" height="240" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="320" y="28" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">机械按键按下瞬间的电平抖动</text>

  <!-- 坐标轴 -->
  <line x1="50" y1="180" x2="610" y2="180" stroke="#999999" stroke-width="1.5"/>
  <line x1="50" y1="60" x2="50" y2="200" stroke="#999999" stroke-width="1.5"/>

  <!-- Y 轴标签 -->
  <text x="30" y="72" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="end" fill="#555555">高</text>
  <text x="30" y="172" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="end" fill="#555555">低</text>

  <!-- 稳定高电平（按下前） -->
  <line x1="50" y1="80" x2="120" y2="80" stroke="#2e7d32" stroke-width="3"/>

  <!-- 抖动区：高-低-高-低-高-低 -->
  <line x1="120" y1="80" x2="130" y2="160" stroke="#2e7d32" stroke-width="3"/>
  <line x1="130" y1="160" x2="150" y2="80" stroke="#2e7d32" stroke-width="3"/>
  <line x1="150" y1="80" x2="160" y2="160" stroke="#2e7d32" stroke-width="3"/>
  <line x1="160" y1="160" x2="180" y2="80" stroke="#2e7d32" stroke-width="3"/>
  <line x1="180" y1="80" x2="190" y2="160" stroke="#2e7d32" stroke-width="3"/>
  <line x1="190" y1="160" x2="210" y2="80" stroke="#2e7d32" stroke-width="3"/>
  <line x1="210" y1="80" x2="220" y2="160" stroke="#2e7d32" stroke-width="3"/>

  <!-- 稳定低电平（按下后） -->
  <line x1="220" y1="160" x2="590" y2="160" stroke="#2e7d32" stroke-width="3"/>

  <!-- 抖动区间阴影 -->
  <rect x="120" y="70" width="100" height="120" fill="#ffeb3b" opacity="0.25"/>
  <line x1="120" y1="185" x2="120" y2="70" stroke="#f9a825" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="220" y1="185" x2="220" y2="70" stroke="#f9a825" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 区间标注 -->
  <text x="170" y="212" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">按下瞬间抖动（10~20ms）</text>
  <text x="405" y="212" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e7d32">稳定按下</text>

  <!-- 时间轴标签 -->
  <text x="50" y="230" font-family="Microsoft YaHei, sans-serif" font-size="12" text-anchor="middle" fill="#777777">按下前</text>
  <text x="590" y="230" font-family="Microsoft YaHei, sans-serif" font-size="12" text-anchor="middle" fill="#777777">时间 →</text>

  <!-- 说明 -->
  <text x="320" y="56" font-family="Microsoft YaHei, sans-serif" font-size="12" text-anchor="middle" fill="#c62828">抖动区每个跳变沿都可能被误判为一次按键 → 必须消抖</text>
</svg>
